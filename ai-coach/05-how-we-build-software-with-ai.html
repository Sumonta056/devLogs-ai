<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>How we build software with AI · Cefalo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#004081; --navy-90:#1a5394; --navy-tint:#e6eef5; --green:#57a11f; --green-20:#ddeccd;
  --cyan:#00a9dc; --cyan-20:#cceef8; --graphite:#4a4a4a; --mist:#f4f6f8; --paper:#ffffff; --ink:#0a0a0a;
  --line:#e0e4e8; --line-soft:#edf0f3; --rust:#c25e3d; --coral:#ff8a65;
  --page:#f4f6f8; --chrome:#ffffff; --chrome-ink:#004081; --chrome-line:#e0e4e8;
  --font:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif; --mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--page:#061a33;--chrome:#0b2748;--chrome-ink:#ffffff;--chrome-line:#1d3d63}}
:root[data-theme="dark"]{--page:#061a33;--chrome:#0b2748;--chrome-ink:#ffffff;--chrome-line:#1d3d63}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{background:var(--page);font-family:var(--font);font-feature-settings:"liga","calt";overflow:hidden;color:var(--ink)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--cyan);outline-offset:3px}

/* viewport + stage (1920x1080 canvas scaled to fit) */
#app{position:relative;width:100%;height:100%;display:flex;flex-direction:column}
#vp{position:relative;flex:1;overflow:hidden}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;overflow:hidden;box-shadow:0 6px 30px rgba(0,64,129,.12);background:var(--paper)}
.slide{position:absolute;inset:0;padding:120px 80px 160px;background:var(--paper);opacity:0;transition:opacity .35s ease}
.slide.in{opacity:1}
.slide.navy{background:var(--navy);color:var(--paper)}

/* reveal system */
.rv{opacity:0;transform:translateY(18px);transition:opacity .45s ease,transform .45s ease;transition-delay:var(--d,0ms)}
.slide.in .rv{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){.rv{transform:none;transition:none}.slide{transition:none}.slide.in .rv{opacity:1}}

/* chrome inside slides */
.eyebrow{position:absolute;top:64px;left:80px;font-size:22px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--navy)}
.navy .eyebrow{color:rgba(255,255,255,.8)}
.modetag{position:absolute;top:56px;right:80px;font-size:22px;font-weight:600;padding:8px 22px;border-radius:999px;border:1.5px solid var(--navy);color:var(--navy)}
.logo{position:absolute;left:80px;bottom:64px;width:171px;height:36px}
.pageno{position:absolute;right:80px;bottom:66px;font-size:22px;font-weight:500;color:var(--graphite);font-variant-numeric:tabular-nums slashed-zero}
.navy .pageno{color:rgba(255,255,255,.7)}
.foot{position:absolute;left:280px;bottom:70px;font-size:20px;color:var(--graphite)}

/* ---------- cover ---------- */
.ic{position:absolute;right:-110px;top:-70px;width:620px;opacity:.3;pointer-events:none}
.cover h1{margin:0;font-size:136px;line-height:1.02;font-weight:700;letter-spacing:-.035em;max-width:1180px}
.cover .lead{margin:32px 0 0;font-size:34px;line-height:1.45;color:rgba(255,255,255,.82);max-width:1040px}
.choices{position:absolute;left:80px;right:80px;top:560px;display:grid;grid-template-columns:repeat(3,1fr);gap:32px}
.choice{text-align:left;background:rgba(255,255,255,.06);border:1.5px solid rgba(255,255,255,.28);border-radius:24px;padding:40px 40px 36px;color:var(--paper);display:flex;flex-direction:column;gap:14px;min-height:300px;transition:background .2s,border-color .2s,color .2s,transform .2s}
.choice:hover{border-color:var(--paper);transform:translateY(-2px)}
.choice .ci{width:56px;height:56px;border-radius:50%;border:1.5px solid currentColor;display:grid;place-items:center}
.choice .ci svg{width:28px;height:28px}
.choice b{font-size:42px;font-weight:700;letter-spacing:-.015em}
.choice span{font-size:26px;line-height:1.4;opacity:.85}
.choice em{margin-top:auto;font-style:normal;font-size:24px;font-weight:600;font-variant-numeric:tabular-nums}
.choice[aria-pressed="true"]{background:var(--paper);color:var(--navy);border-color:var(--paper)}
.choice[aria-pressed="true"] span{opacity:1;color:var(--graphite)}
.runbtn{position:absolute;right:80px;bottom:52px;display:inline-flex;align-items:center;gap:16px;background:var(--paper);color:var(--navy);border:0;border-radius:999px;padding:22px 44px;font-size:30px;font-weight:600;transition:background .2s,color .2s}
.runbtn:hover{background:var(--cyan);color:var(--ink)}
.runbtn svg{width:26px;height:26px}

/* ---------- step slide ---------- */
.grid{display:grid;grid-template-columns:820px 1fr;gap:96px}
.stagechip{display:inline-flex;align-items:center;gap:18px;font-size:26px;font-weight:600;color:var(--navy)}
.stagechip i{width:72px;height:72px;border-radius:50%;background:var(--navy-tint);display:grid;place-items:center}
.stagechip i svg{width:36px;height:36px;stroke:var(--navy)}
.h2{margin:28px 0 24px;font-size:68px;line-height:1.08;font-weight:700;letter-spacing:-.028em;color:var(--navy)}
.sub{margin:0;font-size:30px;line-height:1.5;color:var(--graphite);max-width:780px}
.time{margin-top:44px;display:flex;flex-direction:column;gap:14px}
.time .big{display:flex;align-items:baseline;gap:24px}
.time .big b{font-size:76px;font-weight:700;letter-spacing:-.02em;color:var(--navy);font-variant-numeric:tabular-nums}
.time .big s{font-size:30px;color:var(--graphite);text-decoration-thickness:2px}
.time small{font-size:24px;color:var(--graphite)}
.bars{display:grid;grid-template-columns:130px 1fr;gap:10px 20px;align-items:center;font-size:22px;color:var(--graphite);max-width:640px}
.bars .b{height:14px;border-radius:7px;background:var(--line-soft);overflow:hidden}
.bars .b i{display:block;height:100%;border-radius:7px;width:0;transition:width 1.1s ease;transition-delay:var(--d,0ms)}
.slide.in .bars .b i{width:var(--w)}

.card{border:1.5px solid var(--line);border-radius:24px;padding:36px 32px;align-self:start}
.card h3{margin:0 0 22px;font-size:26px;font-weight:600;color:var(--graphite)}
.steps{position:relative;display:flex;flex-direction:column;gap:16px}
.steps .rail{position:absolute;left:28px;top:40px;bottom:40px;width:2px;background:var(--line)}
.steps .rail i{position:absolute;left:0;top:0;width:100%;height:0;background:var(--navy);transition:height 2.2s ease .3s}
.slide.in .steps .rail i{height:100%}
.st{position:relative;display:grid;grid-template-columns:58px 1fr;gap:24px;align-items:center}
.st .a{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;background:var(--paper);border:2px solid var(--line);position:relative;z-index:1}
.st .a svg{width:30px;height:30px}
.st p{margin:0;font-size:29px;line-height:1.3;font-weight:500;color:var(--ink)}
.st p small{display:block;font-size:22px;font-weight:600;color:var(--graphite);margin-bottom:2px}
.st.team .a{border-color:var(--navy)} .st.team .a svg{stroke:var(--navy)}
.st.ai .a{border-color:var(--cyan);background:var(--cyan-20)} .st.ai .a svg{stroke:var(--navy)}
.st.pain .a{border-color:var(--rust);background:#f8e7e1} .st.pain .a svg{stroke:var(--rust)}
.st.pain p{color:var(--rust);font-weight:600}
.st.you .a{border-color:var(--navy);background:var(--navy)} .st.you .a svg{stroke:var(--paper)}
.st.you p{color:var(--navy);font-weight:600}
.st.skip .a{border-color:var(--navy-tint);background:var(--navy-tint)} .st.skip .a svg{stroke:var(--navy)}
.st.skip p{color:var(--graphite)}
.loopnote{margin-top:20px;display:flex;align-items:center;gap:16px;padding:14px 22px;border-radius:16px;background:var(--cyan-20);font-size:24px;font-weight:500;color:var(--navy)}
.loopnote svg{flex:0 0 34px;width:34px;height:34px;stroke:var(--navy)}
.slide.in .loopnote svg{animation:turn 1.2s ease var(--d,0ms) 2}
.helpers{margin-top:30px;display:flex;flex-wrap:wrap;align-items:center;gap:12px;font-size:22px;color:var(--graphite)}
.helpers span{padding:8px 18px;border-radius:999px;border:1.5px solid var(--navy);color:var(--navy);font-weight:600}
@keyframes turn{to{transform:rotate(-360deg)}}
.kitlabel{margin:18px 0 10px;font-size:19px;font-weight:600;color:var(--graphite)}
.kit{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
.kt{grid-column:span 2;display:grid;grid-template-columns:40px minmax(0,1fr);gap:2px 12px;align-items:start;border-radius:16px;background:var(--bg);border:1.5px solid var(--bg);padding:13px 14px 14px;min-width:0}
.kt:nth-child(n+4){grid-column:span 3}
.kt i{grid-row:1/4;width:40px;height:40px;border-radius:50%;background:var(--c);display:grid;place-items:center}
.kt i svg{width:20px;height:20px;stroke:var(--ic,#fff)}
.kt span{font-size:14px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--lab)}
.kt b{font-size:19px;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kt small{font-size:15.5px;line-height:1.35;color:var(--graphite)}
.t-skill{--bg:#dff4fb;--c:#00a9dc;--ic:#0a0a0a;--lab:#00688a}
.t-agent{--bg:#e6eef5;--c:#004081;--lab:#004081}
.t-hook{--bg:#fbf1d6;--c:#f5c842;--ic:#0a0a0a;--lab:#8a6200}
.t-plugin{--bg:#eeeafb;--c:#7b5ea7;--lab:#5d4388}
.t-mcp{--bg:#e6f1dc;--c:#57a11f;--lab:#3d7514}
.kt.off{--bg:transparent;--c:transparent;--ic:#9aa5b1;--lab:#9aa5b1;border:1.5px dashed #c9d1d9}
.kt.off i{border:1.5px solid #c9d1d9}
.kt.off b{color:#9aa5b1;font-weight:500}
/* toolkit slide */
.tk{position:absolute;left:80px;right:80px;top:420px;display:grid;grid-template-columns:repeat(5,1fr);gap:24px}
.tkc{border:1.5px solid var(--line);border-radius:24px;padding:36px 30px;display:flex;flex-direction:column;gap:16px;min-height:430px}
.tkc .i{width:76px;height:76px;border-radius:50%;background:var(--c);display:grid;place-items:center}
.tkc .i svg{width:36px;height:36px;stroke:var(--ic,#fff)}
.tkc{background:var(--bg);border-color:var(--bg)!important}
.tkc b{color:var(--lab)!important}
.tkc b{font-size:36px;font-weight:700;color:var(--navy);letter-spacing:-.015em}
.tkc p{margin:0;font-size:24px;line-height:1.45;color:var(--graphite)}
.tkc .ex{margin-top:auto;padding-top:16px;border-top:1.5px solid var(--line);font-size:20px;color:var(--graphite)}
.tkc .ex code{display:block;margin-top:6px;font-family:var(--mono);font-size:19px;color:var(--ink)}

/* compact journey tracker (bottom zone, centred) */
.track{position:absolute;left:50%;bottom:62px;transform:translateX(-50%);width:620px;height:40px}
.track .ln{position:absolute;left:8px;right:8px;top:19px;height:2px;background:var(--line)}
.track .ln i{display:block;height:100%;background:var(--navy);width:var(--p)}
.track .nodes{position:relative;display:flex;justify-content:space-between;align-items:center;height:40px}
.tn{width:16px;height:16px;border-radius:50%;background:var(--paper);border:2px solid var(--line);position:relative}
.tn.done{background:var(--navy);border-color:var(--navy)}
.tn.cur{width:26px;height:26px;background:var(--navy);border:6px solid var(--cyan-20);box-shadow:0 0 0 2px var(--navy)}
.tn.cur.manual{background:var(--rust);border-color:#f8e7e1;box-shadow:0 0 0 2px var(--rust)}

/* ---------- intro (journey) slide ---------- */
.big-track{position:absolute;left:80px;right:80px;top:530px}
.big-track .ln{position:absolute;left:48px;right:48px;top:48px;height:3px;background:var(--line)}
.big-track .ln i{display:block;height:100%;width:0;background:var(--navy);transition:width 2.2s ease .3s}
.slide.in .big-track .ln i{width:100%}
.big-track .nodes{position:relative;display:flex;justify-content:space-between}
.bn{display:flex;flex-direction:column;align-items:center;gap:18px;width:96px;position:relative}
.bn .d{width:96px;height:96px;border-radius:50%;background:var(--paper);border:2px solid var(--navy);display:grid;place-items:center}
.bn .d svg{width:40px;height:40px;stroke:var(--navy)}
.bn.dim .d{border-color:var(--line)}
.bn label{text-align:center;font-size:23px;line-height:1.25;font-weight:600;color:var(--navy);width:170px}
.bn .you{position:absolute;top:-58px;display:inline-flex;align-items:center;gap:8px;padding:6px 14px 6px 8px;border-radius:999px;background:var(--navy);color:var(--paper);font-size:18px;font-weight:600;white-space:nowrap}
.bn .you i{width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,.2);display:grid;place-items:center}
.bn .you svg{width:15px;height:15px;stroke:var(--paper)}
.bn .team{position:absolute;top:-52px;font-size:18px;font-weight:600;color:var(--rust);white-space:nowrap}
.stats{position:absolute;left:80px;right:80px;top:770px;display:grid;grid-template-columns:repeat(3,1fr);gap:48px}
.stat{border-top:2px solid var(--navy);padding-top:22px}
.stat b{display:block;font-size:60px;font-weight:700;letter-spacing:-.02em;color:var(--navy);font-variant-numeric:tabular-nums}
.stat span{font-size:25px;color:var(--graphite)}
.stat.hero{border-color:var(--green)}
.stat.hero b{color:var(--green)}

/* ---------- summary ---------- */
.sumgrid{display:grid;grid-template-columns:1fr 640px;gap:120px;margin-top:40px}
.chart{display:flex;flex-direction:column;gap:30px}
.chart h4{margin:0 0 6px;font-size:26px;font-weight:600;color:var(--graphite)}
.cr{display:grid;grid-template-columns:230px 1fr;gap:24px;align-items:center}
.cr span{font-size:26px;font-weight:600;color:var(--navy)}
.cr .b{position:relative;height:56px}
.cr .b i{position:absolute;left:0;top:0;bottom:0;border-radius:0 8px 8px 0;background:var(--navy);width:0;transition:width 1.2s ease;transition-delay:var(--d,0ms)}
.slide.in .cr .b i{width:var(--w)}
.cr .b em{position:absolute;top:50%;transform:translateY(-50%);left:calc(var(--w) + 18px);font-style:normal;font-size:28px;font-weight:700;color:var(--navy);white-space:nowrap;font-variant-numeric:tabular-nums;opacity:0;transition:opacity .4s ease;transition-delay:calc(var(--d,0ms) + 900ms)}
.slide.in .cr .b em{opacity:1}
.cr.me span,.cr.me .b em{color:var(--green)}
.cr.me .b i{background:var(--green)}
.sumstats{display:flex;flex-direction:column;gap:36px}
.actions{position:absolute;right:80px;bottom:52px;display:flex;gap:20px}
.pbtn{display:inline-flex;align-items:center;gap:14px;border-radius:999px;padding:20px 38px;font-size:27px;font-weight:600;border:1.5px solid var(--navy);background:transparent;color:var(--navy);transition:background .2s,color .2s,border-color .2s}
.pbtn.fill{background:var(--navy);color:var(--paper)}
.pbtn:hover{background:var(--cyan);border-color:var(--cyan);color:var(--ink)}
.pbtn svg{width:24px;height:24px}

/* ---------- controls (outside the slide) ---------- */
#ctl{flex:0 0 72px;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:0 20px;background:var(--chrome);border-top:1px solid var(--chrome-line);color:var(--chrome-ink);position:relative}
#ctl .grp{display:flex;align-items:center;gap:8px}
.cb{display:inline-flex;align-items:center;gap:8px;height:42px;padding:0 16px;border-radius:999px;border:1.5px solid var(--chrome-line);background:transparent;font-size:15px;font-weight:600;color:var(--chrome-ink)}
.cb:hover:not(:disabled){border-color:var(--cyan)}
.cb:disabled{opacity:.35;cursor:default}
.cb.icon{width:42px;padding:0;justify-content:center}
.cb.main{background:var(--navy);border-color:var(--navy);color:#fff;width:48px;height:48px}
.cb svg{width:18px;height:18px}
.modes{display:inline-flex;border:1.5px solid var(--chrome-line);border-radius:999px;padding:3px;gap:2px}
.modes button{border:0;background:none;border-radius:999px;height:34px;padding:0 14px;font-size:14px;font-weight:600;color:var(--chrome-ink);opacity:.7}
.modes button[aria-pressed="true"]{background:var(--navy);color:#fff;opacity:1}
#count{font-size:15px;font-weight:600;font-variant-numeric:tabular-nums;min-width:62px;text-align:center}
#pbar{position:absolute;left:0;top:-1px;height:3px;background:var(--cyan);width:0}
#app.cover-mode #ctl .runonly{visibility:hidden}
svg.ico{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
@media (max-width:720px){#ctl{flex-basis:auto;flex-wrap:wrap;padding:10px;justify-content:center}.modes button{padding:0 10px}#ctl .hide-s{display:none}}
</style>
</head>
<body>
<div id="app" class="cover-mode">
  <div id="vp"><div id="stage" role="region" aria-roledescription="slide" aria-live="polite"></div></div>
  <nav id="ctl" aria-label="Presentation controls">
    <div id="pbar"></div>
    <div class="grp">
      <button class="cb" id="homeB" title="Back to start"><svg class="ico" viewBox="0 0 24 24"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg><span class="hide-s">Start</span></button>
      <div class="modes runonly" id="modeCtl" role="group" aria-label="Way of working">
        <button data-m="manual">Current flow</button><button data-m="assisted">AI-assisted</button><button data-m="auto">Autonomous</button>
      </div>
    </div>
    <div class="grp runonly">
      <button class="cb icon" id="prevB" aria-label="Previous slide"><svg class="ico" viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button>
      <button class="cb icon main" id="playB" aria-label="Play"><svg class="ico" viewBox="0 0 24 24" id="playI"></svg></button>
      <button class="cb icon" id="nextB" aria-label="Next slide"><svg class="ico" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button>
      <span id="count">1 / 12</span>
    </div>
    <div class="grp">
      <button class="cb icon" id="fsB" aria-label="Full screen"><svg class="ico" viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
    </div>
  </nav>
</div>

<script>
(()=>{
const $=s=>document.querySelector(s);

/* ---------- brand assets (from the Cefalo Design System) ---------- */
const LOGO=(c1,c2,c3,ink)=>`<svg class="logo" viewBox="-2 -2 118 28" fill="none" aria-label="Cefalo"><circle cx="3" cy="3" r="3" fill="${c1}"/><circle cx="3" cy="12" r="3" fill="${c2}"/><circle cx="3" cy="21" r="3" fill="${c3}"/><path d="M97 19V5C97 2.79086 98.7909 1 101 1H109C111.209 1 113 2.79086 113 5V19C113 21.2091 111.209 23 109 23H101C98.7909 23 97 21.2091 97 19Z" stroke="${ink}" stroke-width="2"/><path d="M25 23H15C12.7909 23 11 21.2091 11 19L11 5C11 2.79086 12.7909 1 15 1H25" stroke="${c1===ink?ink:c1}" stroke-width="2" stroke-linecap="round"/><path d="M43 23H33C30.7909 23 29 21.2091 29 19L29 12M43 1H33C30.7909 1 29 2.79086 29 5L29 12M29 12H41.5" stroke="${ink}" stroke-width="2" stroke-linecap="round"/><path d="M47 23L47 12M61 1H51C48.7909 1 47 2.79086 47 5L47 12M47 12H59.5" stroke="${ink}" stroke-width="2" stroke-linecap="round"/><path d="M82 1L82 19C82 21.2091 83.7909 23 86 23H95" stroke="${ink}" stroke-width="2" stroke-linecap="round"/><path d="M60 23L65.25 12M78 23V12M78 12V5.59902C78 3.05905 75.941 1 73.401 1C71.6286 1 70.0139 2.01851 69.2505 3.61808L65.25 12M78 12H65.25" stroke="${ink}" stroke-width="2" stroke-linecap="round"/></svg>`;
const LOGO_PRIMARY=LOGO('#57A11F','#00A9DC','#004081','#004081');
const LOGO_WHITE=LOGO('#FFFFFF','#FFFFFF','#FFFFFF','#FFFFFF');
const IC_WHITE=`<svg class="ic" viewBox="-16 -16 418 392" fill="none" aria-hidden="true"><circle cx="45" cy="45" r="45" fill="#FFFFFF"/><circle cx="45" cy="180" r="45" fill="#FFFFFF"/><circle cx="45" cy="315" r="45" fill="#FFFFFF"/><path d="M369.429 345H219.429C186.292 345 159.429 318.137 159.429 285L159.429 75C159.429 41.8629 186.292 15 219.429 15H369.429" stroke="#FFFFFF" stroke-width="30" stroke-linecap="round"/></svg>`;

/* ---------- icons (thin-line, rounded caps) ---------- */
const P={
  idea:'<path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-3.8 10.6c.6.6.8 1.4.8 2.4h6c0-1 .2-1.8.8-2.4A6 6 0 0 0 12 3z"/>',

const REVIEW_MIN=10;
const MODES={
  manual:{name:'Current flow',icon:'team',desc:'People carry every step by hand and wait on each other.',
    head:'Today, people carry every step by hand',sub:'Nine steps from idea to production. Each one waits for the one before it.'},
  assisted:{name:'AI-assisted',icon:'aiyou',desc:'AI does the work in every step. You approve each result.',
    head:'AI does the work. You approve every step.',sub:'The same nine steps. AI agents do the work, and a person signs off before anything moves on.'},
  auto:{name:'Autonomous',icon:'ai',desc:'AI runs the whole flow. You make the three decisions that matter.',
    head:'AI runs the flow. You make three calls.',sub:'AI moves through all nine steps on its own and stops only for direction, merge and go-live.'}
};
const gateOn=(m,s)=>m==='assisted'||(m==='auto'&&s.critical);
const totalMin=m=>m==='manual'?S.reduce((a,s)=>a+s.mh*60,0):S.reduce((a,s)=>a+s.am+(gateOn(m,s)?REVIEW_MIN:0),0);
const decisions=m=>m==='manual'?S.length:S.filter(s=>gateOn(m,s)).length;
const fixes=m=>m==='manual'?0:7;
function fmtTotal(m){const t=totalMin(m);if(m==='manual')return `≈ ${Math.round(t/60/8)} working days`;return `≈ ${(Math.round(t/30)/2).toString()} hours`}
const fmtH=h=>h===1?'1 hour':`${h} hours`;

/* ---------- state ---------- */
const st={mode:'assisted',idx:0,playing:false,timer:null};
const N=S.length+4; // cover, intro, toolkit, 9 steps, summary

/* ---------- shared parts ---------- */
const chrome=(eyebrow,navy,noPage)=>`<div class="eyebrow">${eyebrow}</div>${navy?LOGO_WHITE:LOGO_PRIMARY}${noPage?'':`<div class="pageno">${String(st.idx+1).padStart(2,'0')} / ${String(N).padStart(2,'0')}</div>`}`;
const modeTag=()=>`<div class="modetag">${MODES[st.mode].name}</div>`;

function smallTrack(cur){
  const man=st.mode==='manual';
  return `<div class="track" aria-label="Step ${cur+1} of ${S.length}"><div class="ln"><i style="--p:${cur/(S.length-1)*100}%"></i></div><div class="nodes">${S.map((s,i)=>`<span class="tn ${i<cur?'done':''} ${i===cur?'cur':''} ${man?'manual':''}" title="${s.name}"></span>`).join('')}</div></div>`;
}

/* ---------- slides ---------- */
function cover(){
  return `<section class="slide navy cover">${IC_WHITE}${chrome('AI in software delivery',true,true)}

   <div class="choices">${Object.entries(MODES).map(([k,m],i)=>`<button class="choice rv" style="--d:${260+i*90}ms" data-m="${k}" aria-pressed="${st.mode===k}"><span class="ci">${ic(m.icon,'')}</span><b>${m.name}</b><span>${m.desc}</span><em>${fmtTotal(k)}${k==='manual'?', all by hand':', '+decisions(k)+' decisions'}</em></button>`).join('')}</div>
   <button class="runbtn rv" style="--d:560ms" id="runB">${ic('play','')}Run the flow</button>
  </section>`;
}
function intro(){
  const m=st.mode,man=m==='manual';
  const stats=man?[[fmtTotal(m),'from idea to production'],['9 of 9','steps done by hand'],['8','hand-offs between people']]
    :[[fmtTotal(m),'from idea to production',true],[String(decisions(m)),m==='assisted'?'approvals by you, one per step':'decisions by you: direction, merge, go-live'],[m==='assisted'?'9 of 9':'6 of 9',m==='assisted'?'steps where AI does the work':'steps AI completes without stopping']];
  return `<section class="slide">${chrome('The journey',false)}${modeTag()}
   <h2 class="h2 rv" style="margin-top:0;--d:60ms">${MODES[m].head}</h2>
   <p class="sub rv" style="--d:160ms;max-width:1100px">${MODES[m].sub}</p>
   <div class="big-track"><div class="ln"><i></i></div><div class="nodes">${S.map((s,i)=>`<div class="bn rv ${man?'':(gateOn(m,s)?'':'dim')}" style="--d:${300+i*160}ms">${man?'<span class="team">People</span>':(gateOn(m,s)?`<span class="you"><i>${ic('you','')}</i>You</span>`:'')}<span class="d">${ic(s.id,'')}</span><label>${s.name}</label></div>`).join('')}</div></div>
   <div class="stats">${stats.map(([b,t,h],i)=>`<div class="stat rv ${h?'hero':''}" style="--d:${1900+i*150}ms"><b>${b}</b><span>${t}</span></div>`).join('')}</div>
  </section>`;
}
function step(i){
  const s=S[i],m=st.mode,man=m==='manual',c=man?s.cur:s.ai,gate=gateOn(m,s);
  let rows='';let d=500;
  if(man){
    rows=c.steps.map(t=>`<div class="st team rv" style="--d:${d+=450}ms"><span class="a">${ic('team','')}</span><p><small>Team</small>${t}</p></div>`).join('')
      +`<div class="st pain rv" style="--d:${d+=500}ms"><span class="a">${ic('alert','')}</span><p><small>Result</small>${c.pain}</p></div>`;
  }else{
    rows=c.steps.map((t,k)=>{const you=t[0]==='@';return `<div class="st ${you?'you':'ai'} rv" style="--d:${d+=450}ms"><span class="a">${ic(you?'you':'ai','')}</span><p><small>${you?'You':'AI'}</small>${you?t.slice(1):t}</p></div>`}).join('')
      +(gate?`<div class="st you rv" style="--d:${d+=550}ms"><span class="a">${ic('you','')}</span><p><small>You decide</small>${s.gate}</p></div>`
            :`<div class="st skip rv" style="--d:${d+=550}ms"><span class="a">${ic('skip','')}</span><p><small>No stop</small>AI moves on to the next step</p></div>`);
  }
  const loop=!man&&s.loop?`<div class="loopnote rv" style="--d:${d+=500}ms">${ic('loop','')}${s.loop}</div>`:'';
  const k=KIT[s.id];d+=300;
  const helpers=!man?`<div class="kitlabel rv" style="--d:${d}ms">AI toolkit on this step</div><div class="kit">${KT.map(([key,lab])=>`<div class="kt t-${key} ${k[key]?'':'off'} rv" style="--d:${d+=140}ms"><i>${ic(key,'')}</i><span>${lab}</span><b>${k[key]?k[key][0]:'Not used'}</b><small>${k[key]?k[key][1]:'Not needed on this step'}</small></div>`).join('')}</div>`:'';
  const maxH=Math.max(...S.map(x=>x.mh));
  const time=man
    ?`<div class="time rv" style="--d:320ms"><div class="big"><b>${fmtH(s.mh)}</b></div><small>Typical time for this step, done by hand</small></div>`
    :`<div class="time rv" style="--d:320ms"><div class="big"><b>${s.am} min</b><s>${fmtH(s.mh)} today</s></div><small>${gate?`Plus about ${REVIEW_MIN} minutes of your time to decide`:'No waiting on a person'}</small></div>`;
  return `<section class="slide">${chrome(`Step ${i+1} of ${S.length}`,false)}${modeTag()}
   <div class="grid"><div>
     <div class="stagechip rv"><i>${ic(s.id,'')}</i>${s.name}</div>
     <h2 class="h2 rv" style="--d:80ms">${c.head}</h2>
     <p class="sub rv" style="--d:180ms">${c.sub}</p>${time}
   </div>
   <div class="card rv" style="--d:300ms"><h3>${man?'How it works today':'How it works with AI'}</h3><div class="steps"><span class="rail"><i></i></span>${rows}</div>${loop}${helpers}</div></div>
   ${smallTrack(i)}
  </section>`;
}
function summary(){
  const m=st.mode,modes=['manual','assisted','auto'];
  const hrs=modes.map(k=>totalMin(k)/60),max=Math.max(...hrs);
  const label=k=>k==='manual'?`${Math.round(totalMin(k)/60)} h`:`${(Math.round(totalMin(k)/30)/2)} h`;
  const head=m==='manual'?`About ${Math.round(totalMin(m)/60/8)} working days from idea to production`:`About ${Math.round(totalMin(m)/30)/2} hours from idea to production`;
  const stats=[[m==='manual'?'Every step':String(decisions(m)),m==='manual'?'is done and decided by people':'human decisions'],[String(fixes(m)),m==='manual'?'issues caught and fixed automatically':'issues caught and fixed automatically'],[m==='manual'?'59 h':`${Math.round(decisions(m)*REVIEW_MIN/6)/10} h`,'of hands-on time from your team']];
  return `<section class="slide">${chrome('The result',false,true)}${modeTag()}
   <h2 class="h2 rv" style="margin-top:0;--d:60ms;max-width:1400px">${head}</h2>
   <div class="sumgrid"><div class="chart rv" style="--d:200ms"><h4>Time from idea to production, in hours</h4>
     ${modes.map((k,i)=>`<div class="cr ${k===m?'me':''}"><span>${MODES[k].name}</span><span class="b"><i style="--w:${Math.max(hrs[i]/max*78,1.5)}%;--d:${400+i*200}ms"></i><em style="--w:${Math.max(hrs[i]/max*78,1.5)}%;--d:${400+i*200}ms">${label(k)}</em></span></div>`).join('')}</div>
   <div class="sumstats">${stats.map(([b,t],i)=>`<div class="stat rv ${i===0&&m!=='manual'?'hero':''}" style="--d:${900+i*150}ms"><b>${b}</b><span>${t}</span></div>`).join('')}</div></div>
   <div class="foot">Illustrative estimates for one medium-sized feature.</div>
   <div class="actions rv" style="--d:1400ms"><button class="pbtn" data-act="replay">${ic('replay','')}Replay</button><button class="pbtn fill" data-act="home">${ic('back','')}Try another way of working</button></div>
  </section>`;
}
function toolkit(){
  const D=[['Skills','Reusable instructions. A playbook the AI follows the same way every time.','/ticket'],
   ['Agents','AI workers with one job, and only the tools that job needs.','planner (read-only)'],
   ['Hooks','Automatic rules that run at set moments. No AI judgement involved.','lint-format'],
   ['Plugins','Bundles of skills, agents and hooks a team installs in one go.','/code-review'],
   ['MCP connections','Secure links to the tools you already use.','Jira, Figma, GitHub']];
  return `<section class="slide">${chrome('The AI toolkit',false)}${modeTag()}
   <h2 class="h2 rv" style="margin-top:0;--d:60ms">Five building blocks behind every step</h2>
   <p class="sub rv" style="--d:160ms;max-width:1100px">On each step that follows, the same five slots show which blocks do the work. A dashed slot means that block isn’t used there.</p>
   <div class="tk">${KT.map(([key],i)=>`<div class="tkc t-${key} rv" style="--d:${300+i*150}ms"><span class="i">${ic(key,'')}</span><b>${D[i][0]}</b><p>${D[i][1]}</p><div class="ex">For example<code>${D[i][2]}</code></div></div>`).join('')}</div>
  </section>`;
}
const build=i=>i===0?cover():i===1?intro():i===2?toolkit():i===N-1?summary():step(i-3);

/* ---------- render ---------- */
function render(){
  const stage=$('#stage');
  const olds=[...stage.querySelectorAll('.slide')];
  stage.insertAdjacentHTML('beforeend',build(st.idx));
  const nu=stage.lastElementChild;
  requestAnimationFrame(()=>requestAnimationFrame(()=>nu.classList.add('in')));
  olds.forEach(o=>{o.classList.remove('in');o.style.pointerEvents='none';setTimeout(()=>o.remove(),380)});
  wire(nu);
  $('#app').classList.toggle('cover-mode',st.idx===0);
  $('#count').textContent=`${st.idx+1} / ${N}`;
  $('#prevB').disabled=st.idx<=1;$('#nextB').disabled=st.idx>=N-1;
  document.querySelectorAll('#modeCtl button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.m===st.mode));
  schedule();
}
function wire(el){
  el.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{st.mode=b.dataset.m;el.querySelectorAll('.choice').forEach(x=>x.setAttribute('aria-pressed',x===b));});
  el.querySelectorAll('.choice').forEach(b=>b.ondblclick=()=>{st.mode=b.dataset.m;start()});
  const r=el.querySelector('#runB');if(r)r.onclick=start;
  el.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>b.dataset.act==='home'?home():start());
}
function go(i){st.idx=Math.max(0,Math.min(N-1,i));render()}
function start(){st.playing=true;setPlayIcon();go(1)}
function home(){st.playing=false;setPlayIcon();go(0)}

/* ---------- autoplay ---------- */
const dwell=i=>i===1?8000:i===2?9000:i===N-1?0:11000;
function schedule(){
  clearTimeout(st.timer);const bar=$('#pbar');
  bar.style.transition='none';bar.style.width='0';
  const t=dwell(st.idx);
  if(!st.playing||st.idx===0||!t){if(st.idx===N-1&&st.playing){st.playing=false;setPlayIcon()}return}
  requestAnimationFrame(()=>{bar.style.transition=`width ${t}ms linear`;bar.style.width='100%'});
  st.timer=setTimeout(()=>go(st.idx+1),t);
}
function setPlayIcon(){$('#playI').innerHTML=st.playing?P.pause:P.play;$('#playB').setAttribute('aria-label',st.playing?'Pause':'Play')}
function toggle(){if(st.idx===0){start();return}st.playing=!st.playing;if(st.playing&&st.idx===N-1)st.idx=1;setPlayIcon();if(st.playing&&st.idx===1&&!document.querySelector('.slide.in'))render();else schedule()}

/* ---------- scaling ---------- */
function fit(){
  const vp=$('#vp'),W=vp.clientWidth,H=vp.clientHeight,k=Math.min(W/1920,H/1080);
  const s=$('#stage');s.style.transform=`scale(${k})`;s.style.left=((W-1920*k)/2)+'px';s.style.top=((H-1080*k)/2)+'px';
}

/* ---------- controls ---------- */
$('#homeB').onclick=home;
$('#prevB').onclick=()=>go(st.idx-1);
$('#nextB').onclick=()=>go(st.idx+1);
$('#playB').onclick=toggle;
document.querySelectorAll('#modeCtl button').forEach(b=>b.onclick=()=>{st.mode=b.dataset.m;render()});
$('#fsB').onclick=()=>{const el=document.documentElement;if(!document.fullscreenElement){(el.requestFullscreen||el.webkitRequestFullscreen||(()=>{})).call(el)}else{(document.exitFullscreen||document.webkitExitFullscreen).call(document)}};
document.addEventListener('keydown',e=>{
  if(e.target.closest&&e.target.closest('button')&&(e.key===' '||e.key==='Enter'))return;
  if(e.key==='ArrowRight'||e.key==='PageDown'){if(st.idx===0)start();else go(st.idx+1)}
  else if(e.key==='ArrowLeft'||e.key==='PageUp'){if(st.idx>1)go(st.idx-1)}
  else if(e.key===' '){e.preventDefault();toggle()}
  else if(e.key==='Enter'&&st.idx===0)start();
  else if(e.key==='Home'||e.key==='Escape'&&!document.fullscreenElement)home();
  else if(['1','2','3'].includes(e.key)){st.mode=['manual','assisted','auto'][+e.key-1];render()}
  else if(e.key==='f'||e.key==='F')$('#fsB').click();
});
window.addEventListener('resize',fit);
document.addEventListener('fullscreenchange',()=>setTimeout(fit,50));

setPlayIcon();fit();render();
})();
</script>
