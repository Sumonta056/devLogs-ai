<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Leadership Field Book</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
<style>
:root{
  --back:#D9E2D4; --paper:#F7F9F3; --ink:#16291D; --muted:#5A6B5E; --rule:#D0DACC; --soft:#E7EEE3;
  --moss:#2F5B3E; --on-moss:#F7F9F3; --accent:#E3EDB0; --on-accent:#16291D; --warn:#B4532A; --ok:#2F7A4A;
  --display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --body:"Source Serif 4",Georgia,"Times New Roman",serif;
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --back:#0B120E; --paper:#16211A; --ink:#E6EEE3; --muted:#97A99A; --rule:#2B3A30; --soft:#1D2B22;
    --moss:#8FC29F; --on-moss:#0F1A13; --accent:#33452A; --on-accent:#E6EEE3; --warn:#E08A62; --ok:#7FCB97; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --back:#0B120E; --paper:#16211A; --ink:#E6EEE3; --muted:#97A99A; --rule:#2B3A30; --soft:#1D2B22;
  --moss:#8FC29F; --on-moss:#0F1A13; --accent:#33452A; --on-accent:#E6EEE3; --warn:#E08A62; --ok:#7FCB97; color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{background:var(--back);color:var(--ink);font-family:var(--body);overflow:hidden;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--back)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--moss);outline-offset:3px;border-radius:6px}

/* ---------- chrome ---------- */
.top{flex:none;display:flex;align-items:center;gap:10px;padding:10px 16px}
.top .where{flex:1;min-width:0;font-family:var(--display);font-size:15px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 14px;border-radius:999px;border:1px solid var(--rule);background:var(--paper);font-family:var(--display);font-weight:600;font-size:14px}
.pill svg{width:18px;height:18px}
.pill.icon{width:38px;padding:0;justify-content:center}
.viewport{flex:1;min-height:0;display:grid;place-items:center;padding:4px 16px}
.frame{position:relative}
.slide{position:absolute;left:0;top:0;transform-origin:0 0;background:var(--paper);border-radius:22px;box-shadow:0 2px 6px rgb(0 0 0/.05),0 24px 60px rgb(20 40 25/.14);overflow:hidden}
.bottom{flex:none;display:flex;align-items:center;gap:14px;padding:10px 16px calc(12px + env(safe-area-inset-bottom,0px))}
.track{flex:1;height:4px;border-radius:2px;background:var(--rule);overflow:hidden}
.track i{display:block;height:100%;background:var(--ink);opacity:.55;transition:width .4s ease}
.count{font-family:var(--display);font-size:14px;color:var(--muted);min-width:64px;text-align:center}
.nav{height:44px;padding:0 20px}
.nav.next{background:var(--moss);color:var(--on-moss);border-color:var(--moss)}
.nav[disabled]{opacity:.35;cursor:default}
@media (max-width:600px){.nav .lbl{display:none}.nav{width:44px;padding:0;justify-content:center}.top .where{display:none}}

/* contents overlay */
.contents{position:fixed;inset:0;z-index:60;background:var(--back);overflow:auto;padding:calc(20px + env(safe-area-inset-top,0px)) clamp(16px,4vw,48px) calc(40px + env(safe-area-inset-bottom,0px));display:none}
.contents.open{display:block;animation:fadein .25s both}
@keyframes fadein{from{opacity:0}}
.contents .head{display:flex;justify-content:space-between;align-items:center;max-width:1100px;margin:0 auto 18px}
.contents h2{font-family:var(--display);font-size:30px;margin:0}
.parts{max-width:1100px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
.part{background:var(--paper);border-radius:18px;padding:18px}
.part h3{font-family:var(--display);font-size:15px;color:var(--muted);font-weight:600;margin:0 0 4px}
.part h4{font-family:var(--display);font-size:20px;margin:0 0 10px;line-height:1.2}
.part button{display:flex;gap:12px;width:100%;text-align:left;border:0;background:none;padding:8px 6px;border-radius:8px;font-size:16px;line-height:1.3}
.part button span{font-family:var(--display);color:var(--muted);min-width:22px}
.part button:hover,.part button.on{background:var(--soft)}

/* ---------- slide internals (canvas px) ---------- */
.s{position:absolute;inset:0;display:flex;flex-direction:column;padding:48px 64px 40px;font-size:20px;line-height:1.5}
.portrait .s{padding:30px 24px 24px;font-size:17px}
.portrait .title{font-size:30px}.portrait .lead{font-size:19px}.portrait .cover h1{font-size:40px!important}.portrait .cover .subt{font-size:19px}
.portrait .key{font-size:18px}.portrait .letters span{width:48px;height:48px;font-size:30px}.portrait .cover .ghost{font-size:220px}
.portrait .tile .L{font-size:40px}.portrait .tile{padding:14px}.portrait .tile b{font-size:17px}.portrait .tile span:last-child{font-size:15px}
.portrait .item b{font-size:18px}.portrait .item p{font-size:16px}.portrait .sr>span{padding:10px 12px;font-size:16px}.portrait .sr{grid-template-columns:1fr 26px 1fr}
.portrait .flip{height:auto;min-height:150px}.portrait .flip .bad,.portrait .flip .good{font-size:19px}.portrait .flips{grid-template-columns:1fr}
.portrait .bubble{font-size:17px}.portrait .stack b{font-size:36px}.portrait .inside button{font-size:16px}.portrait .quote p{font-size:26px}
.portrait .tier{font-size:15px;min-height:56px}.portrait .det{min-height:0}.portrait .det h3{font-size:24px}
.portrait .cell{min-height:90px;padding:12px}.portrait .cell b{font-size:17px}.portrait .eq{padding:18px}.portrait .gtab{font-size:12px}.portrait .gtab td:first-child{width:80px}
.portrait .gscroll{overflow-x:auto}.portrait .gtab{min-width:720px;font-size:13px}
.portrait .grow{grid-template-columns:1fr}.portrait .grow b{padding-bottom:0}.portrait .grow div{padding:4px 16px 10px}
.anim{animation:turnF .45s cubic-bezier(.2,.7,.2,1) both}
.anim.back{animation-name:turnB}
@keyframes turnF{from{opacity:0;transform:translateX(30px)}}
@keyframes turnB{from{opacity:0;transform:translateX(-30px)}}
.rv{animation:rise .5s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--d,0) * 50ms + 100ms)}
@keyframes rise{from{opacity:0;transform:translateY(12px)}}
.hd{flex:none;margin-bottom:22px}
.crumb{font-family:var(--display);font-size:15px;color:var(--muted);margin:0 0 4px;display:flex;justify-content:space-between;gap:20px}
.dots{display:flex;gap:5px;align-items:center}
.dots i{width:18px;height:4px;border-radius:2px;background:var(--rule)}
.dots i.on{background:var(--moss)}
h1,h2,h3,h4,h5{font-family:var(--display);letter-spacing:-.02em;line-height:1.08;margin:0}
.title{font-size:44px;font-weight:800}
.fitwrap{flex:1;min-height:0;overflow:hidden;position:relative}
.fitbox{transform-origin:0 0}
.fitwrap.mid{display:flex;flex-direction:column;justify-content:center;padding-bottom:3%}
.fitwrap.mid > .fitbox{flex:none}
.lead{font-size:24px;line-height:1.4;max-width:60ch;margin:0 0 20px}
.note{color:var(--muted);margin:0 0 14px;font-size:19px;max-width:70ch}
.sub{font-size:26px;font-weight:600;margin:0 0 14px;display:flex;flex-wrap:wrap;align-items:baseline;gap:12px}
.ht{font-family:var(--body);font-style:italic;font-weight:400;font-size:16px;color:var(--muted);letter-spacing:0}
.use{display:flex;gap:12px;align-items:baseline;margin:18px 0 0;font-size:19px}
.use b{font-family:var(--display);font-size:14px;background:var(--moss);color:var(--on-moss);padding:3px 10px;border-radius:5px;white-space:nowrap}
.tip{display:flex;gap:14px;padding:14px 18px;margin:18px 0 0;background:var(--soft);border-radius:12px;font-size:19px}
.tip b{font-family:var(--display);white-space:nowrap}

/* covers */
.cover{display:grid;grid-template-columns:1.25fr 1fr;gap:56px;align-items:center;height:100%}
.portrait .cover{grid-template-columns:1fr;align-content:center;gap:36px}
.cover .ghost{position:absolute;right:-20px;top:-70px;font-family:var(--display);font-weight:800;font-size:360px;line-height:.8;color:transparent;-webkit-text-stroke:2px var(--rule);pointer-events:none;user-select:none;animation:ghost 1.1s cubic-bezier(.2,.7,.2,1) both}
@keyframes ghost{from{opacity:0;transform:translateX(50px)}}
.cover > div{position:relative}
.kick{font-family:var(--display);font-size:18px;color:var(--muted);margin-bottom:14px}
.cover h1{font-size:68px;font-weight:800}
.cover .subt{font-size:24px;color:var(--muted);margin:16px 0 0;max-width:34ch;line-height:1.35}
.key{margin:26px 0 0;font-size:23px;font-style:italic;line-height:1.4;padding-left:18px;border-left:4px solid var(--moss);max-width:36ch}
.letters{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 24px}
.letters span{font-family:var(--display);font-weight:800;font-size:40px;width:64px;height:64px;display:grid;place-items:center;border-radius:14px;background:var(--moss);color:var(--on-moss);animation:drop .6s cubic-bezier(.3,1.5,.5,1) both;animation-delay:calc(var(--i) * 80ms + 120ms)}
@keyframes drop{from{opacity:0;transform:translateY(-36px) rotate(-8deg)}}
.inside{background:var(--soft);border-radius:18px;padding:22px 24px}
.inside b{font-family:var(--display);font-size:16px;color:var(--muted);font-weight:600}
.inside ol{margin:10px 0 0;padding:0;list-style:none;counter-reset:x}
.inside li{counter-increment:x}
.inside button{display:flex;gap:12px;width:100%;text-align:left;border:0;background:none;padding:9px 0;border-top:1px solid var(--rule);font-size:19px;line-height:1.3}
.inside li:first-child button{border-top:0}
.inside button::before{content:counter(x);font-family:var(--display);color:var(--muted);min-width:20px}
.inside button:hover{color:var(--moss)}
.src{margin-top:16px;font-size:16px;color:var(--muted)}
.cta{display:inline-flex;margin-top:30px;background:var(--moss);color:var(--on-moss);border:0;border-radius:999px;padding:14px 28px;font-family:var(--display);font-weight:600;font-size:19px}
.cta.alt{background:transparent;color:var(--ink);border:1px solid var(--rule);margin-left:10px}
.stack{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.stack div{background:var(--soft);border-radius:16px;padding:18px 20px;font-family:var(--display)}
.stack b{display:block;font-size:48px;font-weight:800;line-height:1}
.stack span{color:var(--muted);font-size:17px}
kbd{font-family:var(--display);border:1px solid var(--rule);border-bottom-width:2px;border-radius:5px;padding:0 6px;font-size:15px;background:var(--paper)}

/* blocks */
.acro{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:14px}
.portrait .acro{grid-template-columns:repeat(2,minmax(0,1fr))}
.tile{background:var(--soft);border-radius:18px;padding:22px 20px}
.tile .L{display:block;font-family:var(--display);font-weight:800;font-size:60px;line-height:1;margin-bottom:14px;color:var(--moss)}
.tile b{display:block;font-family:var(--display);font-size:21px;line-height:1.2;margin-bottom:8px}
.tile span:last-child{color:var(--muted);font-size:18px;line-height:1.4;display:block}
.acro.sm .tile{padding:18px 16px}.acro.sm .L{font-size:46px}.acro.sm b{font-size:19px}.acro.sm span:last-child{font-size:16.5px}

.list{display:grid;grid-template-columns:repeat(var(--cols,2),minmax(0,1fr));gap:0 36px}
.portrait .list{grid-template-columns:1fr}
.item{display:grid;grid-template-columns:auto 1fr;gap:16px;padding:14px 0;border-top:1px solid var(--rule)}
.item .n{font-family:var(--display);font-weight:800;font-size:24px;color:var(--moss);min-width:30px;line-height:1.25}
.item .n.dot::before{content:"";display:block;width:12px;height:12px;margin-top:9px;border-radius:50%;background:var(--moss)}
.item .n.warn{color:var(--warn)}
.item b{display:block;font-family:var(--display);font-size:21px;line-height:1.25;font-weight:600}
.item p{margin:4px 0 0;color:var(--muted);font-size:18px;line-height:1.45}
.item .say{color:var(--ink);font-style:italic;margin-top:6px}

.swap{border-radius:16px;overflow:hidden;background:var(--soft)}
.sr{display:grid;grid-template-columns:1fr 50px 1.15fr;align-items:center;border-top:1px solid var(--rule)}
.sr:first-child{border-top:0}
.sr>span{padding:15px 20px}
.sr.h{font-family:var(--display);font-weight:600;font-size:17px}
.sr.h .x{color:var(--muted)}
.sr.h .y{background:var(--moss);color:var(--on-moss);align-self:stretch;display:flex;align-items:center}
.sr .x{color:var(--muted)}
.sr .y{font-weight:600;background:var(--paper);align-self:stretch;display:flex;align-items:center}
.sr .arr{text-align:center;padding:0;color:var(--moss);font-family:var(--display);font-weight:800;font-size:22px}
.sr:not(.h) .arr{animation:nudge 2.6s ease-in-out infinite;animation-delay:calc(var(--d,0)*140ms)}
@keyframes nudge{0%,70%,100%{transform:none}80%{transform:translateX(6px)}}
.swap.dd .sr:not(.h) .x::before{content:"✗\00a0";color:var(--warn);font-weight:700}
.swap.dd .sr:not(.h) .y::before{content:"✓\00a0";color:var(--ok)}

.script{display:grid;gap:12px}
.script.two{grid-template-columns:1fr 1fr}
.portrait .script.two{grid-template-columns:1fr}
.line{display:grid;grid-template-columns:150px 1fr;gap:18px;align-items:center}
.line.plain{grid-template-columns:1fr}
.line .who{font-family:var(--display);font-weight:600;display:flex;gap:10px;align-items:center;font-size:19px}
.line .who i{font-style:normal;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--moss);color:var(--on-moss);font-size:15px;font-weight:800}
.bubble{background:var(--soft);border-radius:20px 20px 20px 4px;padding:14px 20px;font-style:italic;font-size:20px}
.portrait .line{grid-template-columns:1fr;gap:6px}

.checks{display:grid;gap:4px}
.checks.two{grid-template-columns:1fr 1fr;gap:4px 16px}
.portrait .checks.two{grid-template-columns:1fr}
.ckm{grid-column:1/-1;display:flex;align-items:center;gap:14px;margin-bottom:6px;font-family:var(--display);font-size:16px;color:var(--muted)}
.ckm .t{flex:1;max-width:320px;height:8px;border-radius:4px;background:var(--soft);overflow:hidden}
.ckm .t i{display:block;height:100%;width:0;background:var(--moss);transition:width .35s ease}
.ck{display:flex;gap:14px;align-items:center;width:100%;text-align:left;border:0;background:var(--soft);padding:13px 16px;border-radius:12px;font-size:20px;line-height:1.3;transition:background .2s}
.ck .box{flex:none;width:26px;height:26px;border-radius:7px;border:2px solid var(--moss);display:grid;place-items:center;transition:background .2s}
.ck .box svg{width:17px;height:17px;stroke:var(--on-moss);stroke-width:3;fill:none;stroke-dasharray:24;stroke-dashoffset:24;transition:stroke-dashoffset .3s ease}
.ck[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.ck[aria-pressed="true"] .box{background:var(--moss)}
.ck[aria-pressed="true"] .box svg{stroke-dashoffset:0}

.mrow{display:grid;grid-template-columns:600px 1fr;gap:40px;align-items:center}
.portrait .mrow{grid-template-columns:1fr}
.matrix{display:grid;grid-template-columns:30px 1fr;grid-template-rows:1fr auto;gap:8px}
.matrix .my{writing-mode:vertical-rl;transform:rotate(180deg);text-align:center;font-family:var(--display);font-size:15px;color:var(--muted)}
.matrix .mx{grid-column:2;text-align:center;font-family:var(--display);font-size:15px;color:var(--muted)}
.mg{display:grid;grid-template-columns:1fr 1fr;gap:10px;border-left:2px solid var(--muted);border-bottom:2px solid var(--muted);padding:0 0 10px 10px}
.cell{background:var(--soft);border-radius:14px;padding:18px;min-height:120px}
.cell b{display:block;font-family:var(--display);font-size:21px}
.cell span{color:var(--muted);font-size:17px;line-height:1.35;display:block;margin-top:6px}
.cell.hi{background:var(--moss);color:var(--on-moss)}
.cell.hi span{color:var(--on-moss);opacity:.85}
.mside .tip:first-child,.mside .use:first-child,.mside .note:first-child{margin-top:0}

.eq{display:flex;align-items:center;gap:22px;background:var(--soft);border-radius:20px;padding:26px 30px}
.portrait .eq{flex-direction:column}
.eq .t{font-family:var(--display);font-weight:800;font-size:34px;background:var(--moss);color:var(--on-moss);padding:12px 26px;border-radius:999px}
.eq .eqs{font-family:var(--display);font-size:38px;color:var(--muted)}
.frac{flex:1}
.frac .top{display:flex;flex-wrap:wrap;align-items:center;gap:14px;justify-content:center;text-align:center}
.frac .top em{font-style:normal;font-family:var(--display);font-size:30px;color:var(--moss)}
.term b{display:block;font-family:var(--display);font-size:21px}
.term i{font-size:16px;color:var(--muted)}
.frac .rule{height:3px;background:var(--ink);margin:14px 0;border-radius:2px;transform-origin:left;animation:grow .8s .3s cubic-bezier(.6,0,.2,1) both}
@keyframes grow{from{transform:scaleX(0)}}
.frac .bot{text-align:center}

.audit{background:var(--soft);border-radius:16px;padding:8px 22px}
.arow{display:grid;grid-template-columns:190px 1fr 260px;gap:18px;align-items:center;padding:13px 0;border-bottom:1px solid var(--rule)}
.portrait .arow{grid-template-columns:1fr 1fr}
.arow b{font-family:var(--display);font-size:20px;justify-self:start;padding:0 6px;border-radius:5px}
.arow .q{color:var(--muted)}
.arow label{display:flex;align-items:center;gap:12px}
.arow input{flex:1;accent-color:var(--moss);height:28px}
.arow .v{font-family:var(--display);font-weight:800;font-size:22px;width:20px}
.arow.low b{background:var(--moss);color:var(--on-moss)}
.ares{padding:16px 0 10px;font-size:19px}

.tl{list-style:none;padding:0;margin:20px 0 0;position:relative;display:grid;grid-template-columns:repeat(4,1fr);gap:20px}
.tl::before{content:"";position:absolute;left:0;right:0;top:13px;height:3px;background:var(--rule)}
.tl li{position:relative;padding-top:44px}
.tl li::before{content:"";position:absolute;top:2px;left:0;width:26px;height:26px;border-radius:50%;background:var(--paper);border:4px solid var(--moss)}
.tl .when{font-family:var(--display);font-weight:800;font-size:24px}
.tl p{margin:6px 0 0;font-size:20px}
.portrait .tl{grid-template-columns:1fr}
.portrait .tl::before{left:11px;right:auto;top:0;bottom:0;width:3px;height:auto}
.portrait .tl li{padding:0 0 0 44px}

.flips{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.portrait .flips{grid-template-columns:1fr 1fr}
.flip{perspective:1000px;border:0;background:none;padding:0;text-align:left;height:220px}
.flip .in{display:grid;height:100%;transition:transform .55s cubic-bezier(.4,.2,.2,1);transform-style:preserve-3d}
.flip .f,.flip .b{grid-area:1/1;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:18px;padding:20px 22px;display:flex;flex-direction:column;gap:8px}
.flip .f{background:var(--soft)}
.flip .b{background:var(--moss);color:var(--on-moss);transform:rotateY(180deg)}
.flip[aria-pressed="true"] .in{transform:rotateY(180deg)}
.flip .no{font-family:var(--display);font-size:15px;color:var(--muted)}
.flip .b .no,.flip .b .hint{color:var(--on-moss);opacity:.75}
.flip .bad{font-family:var(--display);font-weight:600;font-size:25px;line-height:1.15}
.flip .why{color:var(--muted);font-size:18px}
.flip .good{font-family:var(--display);font-weight:600;font-size:25px;line-height:1.2}
.flip .hint{margin-top:auto;font-size:15px;color:var(--muted)}

.pyrx{display:grid;grid-template-columns:1fr 1.1fr;gap:44px;align-items:center}
.portrait .pyrx{grid-template-columns:1fr}
.pyr{display:grid;gap:8px}

/* ===================== VIEWER ===================== */
const $ = s => document.querySelector(s);
const slide = $("#slide"), frame = $("#frame"), vp = $("#vp");
let cur = 0, W = 1280, H = 720, timer = null;
const store = {get(){try{return parseInt(localStorage.getItem("lfb-slide") || "0", 10) || 0}catch(e){return 0}}, set(v){try{localStorage.setItem("lfb-slide", v)}catch(e){}}};

function layout() {
  const aw = vp.clientWidth - 32, ah = vp.clientHeight - 8;
  const portrait = aw / ah < 0.95;
  if (portrait) { W = 480; H = Math.round(W * ah / aw); } else { W = 1280; H = 720; }
  document.body.classList.toggle("portrait", portrait);
  slide.style.width = W + "px"; slide.style.height = H + "px";
  const s = Math.min(aw / W, ah / H);
  slide.style.transform = `scale(${s})`;
  frame.style.width = W * s + "px"; frame.style.height = H * s + "px";
  fitBody();
}
function fitBody() {
  const b = slide.querySelector(".fitbox"); if (!b) return;
  const cv = b.classList.contains("cv");
  b.style.transform = ""; b.style.width = ""; b.style.minHeight = "";
  const avail = b.parentElement.clientHeight;
  let k = 1;
  for (let p = 0; p < 4; p++) {
    if (cv) b.style.minHeight = (avail / k) + "px";
    const h = b.scrollHeight;
    const nk = Math.max(0.5, Math.min(1, avail / h));
    if (Math.abs(nk - k) < 0.005) break;
    k = nk;
    b.style.width = k < 1 ? `${100 / k}%` : "";
  }
  if (cv) b.style.minHeight = (avail / k) + "px";
  const h = b.scrollHeight;
  if (h * k > avail + 1) k = avail / h;
  b.style.transform = k < 1 ? `scale(${k})` : "";
  b.parentElement.classList.toggle("mid", h * k < avail - 2);
}

function show(i, dir) {
  i = Math.max(0, Math.min(PAGES.length - 1, i));
  if (timer) { clearInterval(timer.id); timer = null; }
  dir = dir || (i >= cur ? 1 : -1); cur = i;
  const P = PAGES[i];
  let html, where = "";
  if (P.type === "book") html = bookCover(store.get());
  else if (P.type === "part") { html = partCover(P.pi); where = `Part ${PARTS[P.pi].n}: ${cap(PARTS[P.pi].t)}`; }
  else if (P.type === "ch") { html = chCover(P.c); where = `Chapter ${P.c.no}: ${cap(P.c.t)}`; }
  else if (P.type === "pg") { html = contentSlide(P.c, P.pg, P.j); where = `Chapter ${P.c.no}: ${cap(P.c.t)}`; }
  else { html = endSlide(); where = "Framework cheat sheet"; }
  slide.innerHTML = `<div class="s anim${dir < 0 ? " back" : ""}">${html}</div>`;
  slide.querySelectorAll(".rv").forEach((el, k) => { if (!el.style.getPropertyValue("--d")) el.style.setProperty("--d", Math.min(k, 14)); });
  $("#where").textContent = where;
  $("#count").textContent = `${i + 1} / ${PAGES.length}`;
  $("#trk").style.width = `${(i / (PAGES.length - 1)) * 100}%`;
  $("#prev").disabled = i === 0; $("#next").disabled = i === PAGES.length - 1;
  if (i > 0) store.set(i);
  if (location.hash !== `#s${i}`) history.replaceState(null, "", `#s${i}`);
  fitBody(); initAudit();
}

    PARTS.map(P => `<div class="part"><h3>Part ${P.n}</h3><h4>${cap(P.t)}</h4>${P.chs.map(c => `<button data-go="${c.start}" data-ch="${c.no}"><span>${c.no}</span>${cap(c.t)}</button>`).join("")}</div>`).join("");

/* ---------- interactions ---------- */
function initAudit() {
  const a = slide.querySelector("[data-audit]"); if (!a) return;
  const upd = () => {
    const rows = [...a.querySelectorAll(".arow")], vals = rows.map(r => +r.querySelector("input").value);
    rows.forEach((r, k) => r.querySelector(".v").textContent = vals[k]);
    const min = Math.min(...vals);
    rows.forEach((r, k) => r.classList.toggle("low", vals[k] === min));
    const lows = rows.filter((r, k) => vals[k] === min).map(r => r.querySelector("b").textContent);
    a.querySelector(".ares").innerHTML = `Start with <b>${lows.join(" and ")}</b>. <span style="color:var(--muted)">Trust Equation: (${vals[0]} + ${vals[1]} + ${vals[2]}) ÷ ${vals[3]} = <b style="color:var(--ink)">${((vals[0] + vals[1] + vals[2]) / vals[3]).toFixed(1)}</b> — here a higher self-orientation score means more focus on yourself, which pulls trust down.</span>`;
  };
  a.addEventListener("input", upd); upd();
}
document.addEventListener("click", e => {
  const go = e.target.closest("[data-go]");
  if (go) { openContents(false); show(+go.dataset.go); return; }
  const t = e.target.closest("[data-act]"); if (!t) return;
  const act = t.dataset.act;
  if (act === "ck" || act === "flip") {
    t.setAttribute("aria-pressed", t.getAttribute("aria-pressed") !== "true");
    const box = t.closest("[data-checks]");
    if (box) { const all = box.querySelectorAll(".ck").length, n = box.querySelectorAll('.ck[aria-pressed="true"]').length; box.querySelector(".ct").textContent = `${n} of ${all}`; box.querySelector(".t i").style.width = `${n / all * 100}%`; }
  }
  if (act === "stg") { t.parentElement.querySelectorAll(".stg").forEach(s => s.setAttribute("aria-pressed", s === t)); t.closest(".rv").querySelector(".stgout").textContent = t.dataset.h; }
  if (act === "gen") { t.parentElement.querySelectorAll("button").forEach(b => b.setAttribute("aria-selected", b === t)); $("#genPanel").innerHTML = genRows(+t.dataset.i); fitBody(); }
  if (act === "tier") { t.parentElement.querySelectorAll(".tier").forEach(b => b.setAttribute("aria-pressed", b === t)); const d = $("#det"); d.innerHTML = tierDet(+t.dataset.i); d.classList.remove("swapin"); void d.offsetWidth; d.classList.add("swapin"); }
  if (act === "tgo" || act === "treset") pomo(t.closest("[data-timer]"), act);
});
function pomo(el, act) {
  const fg = el.querySelector(".fg"), tm = el.querySelector(".tm"), md = el.querySelector(".md"), btn = el.querySelector('[data-act="tgo"]'), C = 326.7;
  if (!timer) timer = {left:1500, total:1500, mode:"Focus", id:null};
  const s = timer;
  const paint = () => { tm.textContent = `${String(Math.floor(s.left / 60)).padStart(2,"0")}:${String(s.left % 60).padStart(2,"0")}`; md.textContent = s.mode; fg.style.strokeDashoffset = C * (1 - s.left / s.total); fg.style.stroke = s.mode === "Focus" ? "var(--warn)" : "var(--ok)"; };
  if (act === "treset") { clearInterval(s.id); s.id = null; s.left = s.total = 1500; s.mode = "Focus"; btn.textContent = "Start"; paint(); return; }
  if (s.id) { clearInterval(s.id); s.id = null; btn.textContent = "Resume"; return; }
  btn.textContent = "Pause";
  s.id = setInterval(() => { s.left--; if (s.left < 0) { const f = s.mode === "Focus"; s.mode = f ? "Break" : "Focus"; s.total = s.left = f ? 300 : 1500; } paint(); }, 1000);
}

});
let tx = null, ty = null;
vp.addEventListener("touchstart", e => { if (e.target.closest("input,.gscroll")) { tx = null; return; } tx = e.touches[0].clientX; ty = e.touches[0].clientY; }, {passive:true});
vp.addEventListener("touchend", e => { if (tx === null) return; const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty; if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) show(cur + (dx < 0 ? 1 : -1), dx < 0 ? 1 : -1); tx = null; });
addEventListener("resize", layout);
addEventListener("hashchange", () => { const m = location.hash.match(/^#s(\d+)$/); if (m && +m[1] !== cur) show(+m[1]); });
if (document.fonts) document.fonts.ready.then(fitBody);

buildContents();
const m0 = location.hash.match(/^#s(\d+)$/);
show(m0 ? +m0[1] : 0, 1);
layout();

</script>
