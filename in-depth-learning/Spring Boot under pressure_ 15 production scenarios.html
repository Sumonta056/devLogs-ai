  let t,offPts,okPts,capPts,pend,cbOpen,cbT,recovered,peak;
  const reset=()=>{t=0;offPts=[];okPts=[];capPts=[];pend={};cbOpen=false;cbT=0;recovered=null;peak=0};
  const r=rng(3);
  const step=()=>{if(t>TMAX)return;const cap=t>=O0&&t<O1?5:capN;
    let retries=pend[t]||0;delete pend[t];
    if(!B){retries=Math.min(retries,base*.1)}
    let offered=cbOpen?0:base+retries;
    let served;if(offered<=cap)served=offered;else served=cap*Math.pow(cap/offered,1.5);
    const fail=offered-served,f=offered?fail/offered:0;
    if(B){pend[t+1]=(pend[t+1]||0)+fail*.75}
    else if(!cbOpen){for(let k=0;k<3;k++){const d=Math.round(Math.pow(2,k+1)*(.5+r()));pend[t+d]=(pend[t+d]||0)+fail*.1/3}
      if(f>.5){cbOpen=true;cbT=5}}
    if(cbOpen&&--cbT<=0)cbOpen=false;
    if(t>=O1&&recovered===null&&served>=base*.95)recovered=t;
    peak=Math.max(peak,offered);offPts.push([t,offered]);okPts.push([t,served]);capPts.push([t,cap]);t++;draw()};
  const draw=()=>{chart($('[data-cv]',el),{xmax:TMAX,ymax:400,xfmt:v=>v+'s',bands:[{x0:O0,x1:O1,color:'rgba(255,107,127,.10)',label:'outage'}],
      series:[{pts:capPts,color:C.acc,width:1.5},{pts:offPts,color:C.warn,width:2.5},{pts:okPts,color:C.ok,width:2}],marks:recovered!==null?[{x:recovered,y:base,color:C.ok,label:'recovered'}]:[]});
    $('[data-c]',el).innerHTML=chips([[Math.round(peak),'peak req/s sent',peak>capN?'bad':'ok'],[(peak/base).toFixed(1)+'×','amplification',peak/base>1.5?'bad':'ok'],[recovered===null?(t>O1+3?'Not yet':'-'):(recovered-O1)+' s','time to recover after fix',recovered===null&&t>O1+3?'bad':'ok']]);
    $('[data-n]',el).textContent=B?'Every failure is retried immediately, so load jumps far above capacity. When the downstream comes back, the retry backlog keeps it overloaded: most requests time out, get retried, and the cycle continues.':'Backoff with jitter spreads retries out, a 10% retry budget caps them, and the circuit breaker pauses calls. Load stays near normal and the service recovers as soon as it\'s healthy.'};
  const run=()=>{c.stop();reset();c.every(110,step)};$('[data-run]',el).onclick=run;run();
};

  $('#route').innerHTML=STAGES.map((s,i)=>`<div class="stop ${s.qs.every(q=>done[q])?'done':''}" data-n="${i+1}"><h3>${s.name}</h3><p>${s.desc}</p><div class="qs">${s.qs.map(q=>`<button class="qchip ${q===cur?'on':''} ${done[q]?'done':''}" data-go="${q}" title="${esc(Q[q].short)}">Q${q}</button>`).join('')}</div></div>`).join('');
  $('#side').innerHTML=STAGES.map((s,i)=>`<h4>${i+1}. ${s.name}</h4>`+s.qs.map(q=>`<button data-go="${q}" class="${q===cur?'on':''} ${done[q]?'done':''}"><span class="n">${done[q]?'✓':'Q'+q}</span><span>${Q[q].short}</span></button>`).join('')).join('');
  $('#pick').innerHTML=ORDER.map((q,i)=>`<option value="${q}" ${q===cur?'selected':''}>${i+1}. Q${q} ${Q[q].short}${done[q]?' ✓':''}</option>`).join('');
  $$('[data-go]').forEach(b=>b.onclick=()=>go(+b.dataset.go));
  const n=Object.values(done).filter(Boolean).length;$('#progress').textContent=`${n} of 15 understood. Follow the stops left to right, or jump to any question.`;
}
function go(id){if(id===cur&&$('#page').innerHTML)return;location.hash='q'+id}
function renderPage(){
  const q=Q[cur],pos=ORDER.indexOf(cur),prev=ORDER[pos-1],next=ORDER[pos+1],st=STAGES[stageOf(cur)];
  codeTab='before';
  $('#page').innerHTML=`
  <div class="qhead"><p class="qmeta">Question ${cur} of 15. Stop ${stageOf(cur)+1}: ${st.name}. Step ${pos+1} in the learning flow.</p><h2 class="qtitle">${esc(q.q)}</h2></div>
  <section class="blk two"><div class="card eli5"><div class="em" aria-hidden="true">${q.eli5[0]}</div><div><h4>Explain it like I'm 5</h4><p>${esc(q.eli5[1])}</p></div></div>
  <div class="card answer"><h4>Your 30-second interview answer</h4><p>${esc(q.answer)}</p></div></section>
  <section class="blk"><h3>Live demo</h3><div class="demo"><div class="demo-bar"><div class="seg" role="group" aria-label="Before or after the fix"><button data-m="before">Before fix</button><button data-m="after">After fix</button></div><span class="demo-title">${esc(q.short)}</span><button class="restart" data-restart>Restart</button></div><div class="demo-body" id="demo"></div></div></section>
  <section class="blk"><h3>How to investigate, step by step</h3><ol class="flow">${q.steps.map(([a,b])=>`<li><b>${esc(a)}</b><span>${esc(b)}</span></li>`).join('')}</ol></section>
  <section class="blk"><h3>Code</h3><div class="tabs" role="tablist"><button data-t="before" role="tab">Before: the problem</button><button data-t="after" role="tab">After: the fix</button></div><div id="code"></div></section>
  <section class="blk"><h3>What improved</h3><div class="tblwrap"><table class="cmp"><thead><tr><th>Measure</th><th>Before</th><th>After</th></tr></thead><tbody>${q.metrics.map(([m,b,a])=>`<tr><td>${esc(m)}</td><td class="b">${esc(b)}</td><td class="a">${esc(a)}</td></tr>`).join('')}</tbody></table></div></section>
  <section class="blk two pc"><div class="card pro"><h4>Pros of the fix</h4><ul>${q.pros.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div><div class="card con"><h4>Cons and trade-offs</h4><ul>${q.cons.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div></section>
  <div class="pager"><button data-nav="${prev||''}" ${prev?'':'disabled'}><small>Previous</small>${prev?'Q'+prev+' '+Q[prev].short:'Start of the flow'}</button>
  <label class="mark"><input type="checkbox" id="done" ${done[cur]?'checked':''}> I understand this one</label>
  <button data-nav="${next||''}" ${next?'':'disabled'}><small>Next</small>${next?'Q'+next+' '+Q[next].short:'You reached the end'}</button></div>`;
  $$('[data-m]').forEach(b=>b.onclick=()=>{mode=b.dataset.m;mountDemo()});
  $('[data-restart]').onclick=mountDemo;
  $$('.tabs button').forEach(b=>b.onclick=()=>{codeTab=b.dataset.t;renderCode()});
  $$('[data-nav]').forEach(b=>b.onclick=()=>b.dataset.nav&&go(+b.dataset.nav));
  $('#done').onchange=e=>{done[cur]=e.target.checked;saveDone();renderChrome()};
  mode='before';mountDemo();renderCode();
}
function renderCode(){
  $$('.tabs button').forEach(b=>{b.classList.toggle('on',b.dataset.t===codeTab);b.setAttribute('aria-selected',b.dataset.t===codeTab)});
  $('#code').innerHTML=Q[cur].code[codeTab].map(([cap,code])=>`<div class="codeblk"><p class="cap">${esc(cap)}</p><pre class="code"><code>${hl(code)}</code></pre></div>`).join('');
}
function mountDemo(){
  ctx.stop();ctx=makeCtx();
  $$('[data-m]').forEach(b=>{b.classList.toggle('on',b.dataset.m===mode);b.setAttribute('aria-pressed',b.dataset.m===mode)});
  const el=$('#demo');el.innerHTML='';
  try{demos[cur](el,mode,ctx)}catch(e){el.textContent='Demo failed to load: '+e.message;console.error(e)}
}
function route(){const m=location.hash.match(/^#q(\d+)$/);const id=m?+m[1]:ORDER[0];cur=Q[id]?id:ORDER[0];renderChrome();renderPage();if(m)window.scrollTo({top:$('#main').offsetTop-10,behavior:'smooth'})}
$('#pick').onchange=e=>go(+e.target.value);
window.addEventListener('hashchange',route);
let rz;window.addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>{if([9,11,13].includes(cur))mountDemo()},300)});
$('#theme').onclick=()=>{const r=document.documentElement,dark=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches;r.dataset.theme=dark?'light':'dark'};
route();
</script>
<script src="../assets/nav-widget.js" defer data-devlogs-nav></script>
</body>
